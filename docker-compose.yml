# Consulta Empresas Procom - stack de Docker Swarm (Portainer)
# Codigo e imagenes: repo consultaempresasprocom (server/Dockerfile y client/Dockerfile)
#
# Variables del stack (Portainer > Stack > Environment variables):
#   IMAGE_API        imagen de la API, ej. usuario/consultaempresas-api:1.0.0   (obligatoria)
#   IMAGE_WEB        imagen del front, ej. usuario/consultaempresas-web:1.0.0   (obligatoria)
#   NODE             constraint de placement, ej. node.hostname==worker98       (obligatoria)
#   LOKI_URL         URL de Loki para los logs                                  (obligatoria)
#   APP_PORT         puerto publicado en el nodo                                (default 5007)
#   TRAEFIK_NETWORK  red overlay de Traefik                                     (default traefik)
#   Solo si se publica con dominio por Traefik:
#   TRAEFIK_ENABLE=true, DOMAIN, TRAEFIK_ENTRYPOINT (default websecure), TRAEFIK_CERTRESOLVER (default letsencrypt)
#
# Secrets externos (crear antes del primer deploy): ver README.md

version: "3.9"

services:
  # Nombres unicos: la red traefik es compartida con otros stacks y el DNS de Swarm
  # resuelve por nombre de servicio
  consultaempresas-api:
    image: ${IMAGE_API:?Definir IMAGE_API (usuario/consultaempresas-api:tag)}
    environment:
      NODE_ENV: production
      PORT: "5006"
      TZ: America/Argentina/Buenos_Aires
      DB_HOST: 192.168.121.178
      DB_PORT: "3050"
      DB_DATABASE: /SAR/Base/DBADMINISTRADOR.GDB
      DB_USER: INT_CONSULTAEMPRESAS
    secrets:
      - source: consultaempresas_db_password
        target: db_password
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?Definir LOKI_URL}
    # La API no se publica: solo la ve el front por la red interna
    networks:
      - internal
    deploy:
      placement:
        constraints: ["${NODE:?Definir NODE (ej. node.hostname==worker98)}"]
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  consultaempresas-web:
    image: ${IMAGE_WEB:?Definir IMAGE_WEB (usuario/consultaempresas-web:tag)}
    ports:
      - "${APP_PORT:-5007}:80"
    environment:
      TZ: America/Argentina/Buenos_Aires
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?Definir LOKI_URL}
    networks:
      - internal
      - traefik
    deploy:
      placement:
        constraints: ["${NODE:?Definir NODE (ej. node.hostname==worker98)}"]
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 64M
      labels:
        # Apagado por defecto: se accede por IP:APP_PORT como el resto de los servicios del nodo
        - traefik.enable=${TRAEFIK_ENABLE:-false}
        - traefik.http.routers.consulta-empresas.rule=Host(`${DOMAIN:-consultaempresas.local}`)
        - traefik.http.routers.consulta-empresas.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.consulta-empresas.tls=true
        - traefik.http.routers.consulta-empresas.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
        - traefik.http.services.consulta-empresas.loadbalancer.server.port=80
        # Traefik v2 usa traefik.docker.network, v3 usa traefik.swarm.network
        - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
        - traefik.swarm.network=${TRAEFIK_NETWORK:-traefik}

networks:
  internal:
    driver: overlay
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

secrets:
  consultaempresas_db_password:
    external: true
