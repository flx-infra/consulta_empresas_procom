# Consulta Empresas Procom - stack de Docker Swarm (Portainer)
# Codigo e imagen: repo consultaempresasprocom (Dockerfile en la raiz: front + API en una sola imagen)
#
# Variables del stack (Portainer > Stack > Environment variables):
#   IMAGE            imagen de Docker Hub, ej. usuario/consultaempresas:1.0.0   (obligatoria)
#   NODE             constraint de placement, ej. node.hostname==worker98      (obligatoria)
#   LOKI_URL         URL de Loki para los logs                                 (obligatoria)
#   APP_PORT         puerto publicado en el nodo                               (default 3256)
#   TRAEFIK_NETWORK  red overlay de Traefik                                    (default traefik)
#   Solo si se publica con dominio por Traefik:
#   TRAEFIK_ENABLE=true, DOMAIN, TRAEFIK_ENTRYPOINT (default websecure), TRAEFIK_CERTRESOLVER (default letsencrypt)
#
# Secrets externos (crear antes del primer deploy): ver README.md

version: "3.9"

services:
  consultaempresas:
    image: fabreguesm/consultaempresas:1.0.0
    ports:
      - "${APP_PORT:-3256}:5006"
    environment:
      NODE_ENV: production
      PORT: "5006"
      TZ: America/Argentina/Buenos_Aires
      DB_HOST: 192.168.121.178
      DB_PORT: "3050"
      DB_DATABASE: /SAR/Base/DBADMINISTRADOR.GDB
      DB_USER: INT_CONSULTAEMPRESAS
    secrets:
      - source: consultaempresas_db_password
        target: db_password
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?Definir LOKI_URL}
    networks:
      - traefik
    deploy:
      placement:
        constraints: ["${NODE:?Definir NODE (ej. node.hostname==worker98)}"]
      replicas: 1
      update_config:
        # Sin estado: el nuevo arranca antes de bajar el viejo (sin corte)
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      labels:
        # Apagado por defecto: se accede por IP:APP_PORT como el resto de los servicios del nodo
        - traefik.enable=${TRAEFIK_ENABLE:-false}
        - traefik.http.routers.consulta-empresas.rule=Host(`${DOMAIN:-consultaempresas.local}`)
        - traefik.http.routers.consulta-empresas.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.consulta-empresas.tls=true
        - traefik.http.routers.consulta-empresas.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
        - traefik.http.services.consulta-empresas.loadbalancer.server.port=5006
        # Traefik v2 usa traefik.docker.network, v3 usa traefik.swarm.network
        - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
        - traefik.swarm.network=${TRAEFIK_NETWORK:-traefik}

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

secrets:
  consultaempresas_db_password:
    external: true
